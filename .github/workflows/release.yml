name: Publish TorrFilm Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    name: Create GitHub Release and Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          name: "TorrFilm v1.0.3 (Android TV)"
          body: |
            ### 📥 TorrFilm v1.0.3 для Android TV / Google TV

            Поисковик и агрегатор торрент-раздач для телевизоров и медиаприставок.

            #### Что нового в версии 1.0.3:
            - **Отказоустойчивый 3-уровневый каскад Edge-шлюзов:**
              - Интегрированы три независимых шлюза: Supabase Edge (Франкфурт), Azion Edge (Global) и Cloudflare Workers с мгновенным автоматическим переключением (failover) при блокировках или сетевых сбоях.
            - **Отечественный каскад загрузки постеров:**
              - Приоритетная прямая загрузка постеров без прокси с незаблокированных серверов Кинопоиск CDN (`avatars.mds.yandex.net`), TorrentKino CDN и Кино Mail.ru (`resizer.mail.ru`), с автоматическим резервным переключением на Edge-проксирование.
            - **Встроенная сетевая диагностика в настройках:**
              - Экспресс-проверка шлюзов и трекеров в порядке их реального использования с подробным отчетом по каждому узлу.
            - **Управление витриной «Киноновинки»:**
              - Добавлена опция полного отключения витрины «Киноновинки» в настройках. При выключении приложение полностью останавливает любые фоновые обновления и парсинг, экономя трафик и ресурсы ТВ.
            - **Исправление поведения экранной клавиатуры (`adjustNothing`):**
              - Открытие виртуальной клавиатуры больше не сжимает, не двигает и не деформирует карточки результатов поиска.
            - **Идеальное выравнивание в строчном режиме (Список):**
              - Все бейджи трекеров приведены к единой фиксированной ширине для устранения любых сдвигов строк.
            - **Стильная неоновая заглушка:**
              - Обновлена векторная иконка поиска с мягким неоновым свечением и идеальным центрированием подсказки.

            #### Файлы для скачивания:
            - **TorrFilm.apk** (актуальная версия 1.0.3)
            - В репозитории в папке `release/` также сохранена предыдущая версия `TorrFilm_v1.0.2.apk`.
          files: |
            release/TorrFilm.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
