name: Publish TorrFilm Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    name: Create GitHub Release and Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          name: "TorrFilm v1.0.5 (Android TV)"
          body: |
            ### 📥 TorrFilm v1.0.5 для Android TV / Google TV

            Поисковик и агрегатор торрент-раздач для телевизоров и медиаприставок.

            #### Что нового в версии 1.0.5:
            - **Умное автоисправление и логика фокуса голосового поиска:**
              - Интеллектуальное исправление неточно распознанных голосовых запросов по базе кинопроизведений (исправление опечаток и фонетических погрешностей речи).
              - Продвинутая нормализация названий с поддержкой кириллицы, латиницы и смешанных тайтлов.
              - Во время активного поиска фокус пульта надёжно зафиксирован на кнопке «Отменить поиск». При отмене поиска фокус возвращается на микрофон, а при успешной загрузке раздач автоматически переходит на фильтр качества («Любое»).
            - **Плавная бесконечная подгрузка новинок («Киноновинки»):**
              - Бесконечная пагинация с упреждающей пакетной предзагрузкой постеров на 15–20 карточек вперёд — устранены задержки и пустые окна при быстром пролистывании зажатой кнопкой на пульте.
              - Мгновенное синхронное отображение витрины новинок и основного интерфейса при старте приложения (0ms).
            - **Модальное окно синопсиса и плавная карточка фильма:**
              - Добавлена кнопка «ЕЩЁ...», открывающая полный синопсис фильма/сериала в отдельном центрированном окне с крупным шрифтом для комфортного чтения с ТВ.
              - Устранены скачки интерфейса при открытии карточки фильма благодаря предварительному получению жанров, рейтингов Кинопоиск/IMDb, страны и длительности.
              - Оптимизированный тёмный градиентный фон карточки без лишней нагрузки на GPU ТВ-приставки.
            - **3-уровневый каскад Edge-шлюзов и выбор каталога:**
              - Трёхуровневый каскад сетевой оптимизации: кастомный Cloudflare-шлюз + 2 резервных шлюза Supabase с автоматическим переключением.
              - В настройках добавлен выбор источника новинок и постеров: открытые каталоги с раздельным кешированием.
              - Расширенная встроенная диагностика сети в настройках с проверкой каждого узла и CDN.
            - **Улучшения интерфейса и адаптации (1080p и 720p):**
              - Пустая история поиска теперь отображается в виде гармоничной строки с равномерным распределением подсказок по всей ширине.
              - Оптимизированы пропорции кнопки «Найти» и значка голосового ввода для разрешения 1080p.
              - Улучшена читаемость текста, отступы и вертикальное выравнивание плашек в режиме «Список» (построчный вид).

            #### Файлы для скачивания:
            - **TorrFilm.apk** (версия 1.0.5)
          files: |
            release/TorrFilm.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
