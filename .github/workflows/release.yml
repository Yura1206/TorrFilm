name: Publish TorrFilm Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    name: Create GitHub Release and Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('TorrFilm {0} (Android TV)', github.ref_name) || 'TorrFilm v1.0.5 (Android TV)' }}
          body: |
            ### 📥 TorrFilm ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }} для Android TV / Google TV

            Поисковик и агрегатор торрент-раздач для телевизоров и медиаприставок.

            #### Что нового:
            - **Встроенное автообновление (In-App Updater):**
              - Прямая фоновая загрузка обновлений с GitHub с каскадным переключением на скоростные Edge-шлюзы при ограничении доступа.
              - Разделение каналов обновлений («Стабильный» и «Бета / Тест»).
              - Информативное окно с подробным списком изменений и плавной шкалой прогресса скачивания.
            - **Навигация пультом ДУ в разделах «Просмотренное» и «Избранное»:**
              - Одинарное нажатие «Назад» мгновенно возвращает на домашний экран к витрине новинок.
              - Двойное нажатие «Назад» на домашнем экране активирует подтверждение выхода из приложения.
            - **Оптимизация сетевых запросов и стабильности:**
              - Улучшенная синхронизация и быстрый отклик интерфейса.

            #### Файлы для скачивания:
            - **TorrFilm.apk**
          files: |
            release/TorrFilm.apk
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'test') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
