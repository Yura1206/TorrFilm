name: Publish TorrFilm Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    name: Create GitHub Release and Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          name: "TorrFilm v1.0.4 (Android TV)"
          body: |
            ### 📥 TorrFilm v1.0.4 для Android TV / Google TV

            Поисковик и агрегатор торрент-раздач для телевизоров и медиаприставок.

            #### Что нового в версии 1.0.4:
            - **Поддержка 720p (HD) и выбор масштаба интерфейса:**
              - В настройки добавлен переключатель режима масштаба: «Авто», «Компактный (720p)», «Стандартный (1080p)».
              - Все экраны, карточки, отступы и модальные окна адаптированы для комфортного отображения на HD-телевизорах и компактных приставках без обрезания элементов.
            - **Выбор стиля баннера для домашнего экрана ТВ:**
              - В настройках добавлен переключатель стиля: «Стандартный» (полноразмерный фирменный баннер 16:9 со встроенным логотипом и названием) и «Адаптивный» (динамический значок для Projectivy Launcher, ATV Launcher и др.).
            - **Отображение страны производства:**
              - Страна производства теперь отображается в карточках новинок и в меню подробной информации о раздаче.
            - **Обновленный фирменный ТВ-баннер:**
              - Эмблема и название TorrFilm увеличены на 25%, улучшена читаемость и контрастность, добавлены мягкие объемные тени.
            - **Синхронизация голосового поиска:**
              - Мгновенная синхронизация со звуковым сигналом готовности микрофона пульта (onReadyForSpeech chime) без задержек при диктовке.
            - **Оптимизация производительности:**
              - Аппаратное GPU-ускорение интерфейса, повышенная отзывчивость D-Pad навигации (0.05s) и устранение задержек на слабых ТВ-боксах.
            - **Аккуратная рамка фокуса:**
              - Толщина обводки активных элементов оптимизирована (-15% для 1080p) для современного и утонченного внешнего вида.

            #### Файлы для скачивания:
            - **TorrFilm.apk** (версия 1.0.4)
          files: |
            release/TorrFilm.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
