name: Publish TorrFilm Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    name: Create GitHub Release and Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Processing tag: ${TAG}"

          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *"beta"* || "${TAG}" == *"test"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists. Uploading asset with --clobber..."
            gh release upload "${TAG}" release/TorrFilm.apk --clobber
          else
            echo "Release ${TAG} does not exist. Creating..."
            gh release create "${TAG}" release/TorrFilm.apk \
              --title "TorrFilm ${TAG} (Android TV)" \
              --notes-file .github/release_notes.md \
              ${PRERELEASE_FLAG}
          fi
