name: Publish TorrFilm Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    name: Create GitHub Release and Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Target TAG: ${TAG}"

          if [ -z "${TAG}" ] || [ "${TAG}" = "main" ]; then
            echo "Error: TAG is empty or main: ${TAG}"
            exit 1
          fi

          TITLE="TorrFilm ${TAG} (Android TV)"
          
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *"beta"* || "${TAG}" == *"test"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "PRERELEASE_FLAG: ${PRERELEASE_FLAG}"

          EXISTING=$(gh release view "${TAG}" --json tagName -q .tagName 2>/dev/null || true)
          echo "Existing release tag check: '${EXISTING}'"

          if [ "${EXISTING}" = "${TAG}" ]; then
            echo "Release ${TAG} exists. Updating notes and uploading asset..."
            gh release edit "${TAG}" --title "${TITLE}" --notes-file .github/release_notes.md ${PRERELEASE_FLAG}
            gh release upload "${TAG}" release/TorrFilm.apk --clobber
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" release/TorrFilm.apk \
              --title "${TITLE}" \
              --notes-file .github/release_notes.md \
              ${PRERELEASE_FLAG}
          fi
