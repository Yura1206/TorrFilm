name: Publish TorrFilm Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    name: Create GitHub Release and Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}"
          TITLE="TorrFilm ${TAG} (Android TV)"
          
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *"beta"* || "${TAG}" == *"test"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release delete "${TAG}" -y || true

          gh release create "${TAG}" release/TorrFilm.apk \
            --title "${TITLE}" \
            --notes-file .github/release_notes.md \
            ${PRERELEASE_FLAG} \
            --clobber
